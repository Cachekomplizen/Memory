<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tropische Früchte Memory</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body { 
    font-family: Arial, sans-serif;
    text-align: center;
    background: url('https://media.istockphoto.com/id/155099930/de/foto/tropische-blattfiedern-garten.jpg?s=612x612&w=0&k=20&c=RsmWfxiwwWrhRkPjzO9dRfpHRnKgQBm7ypWvpn6O-GQ=') no-repeat center center fixed;
    background-size: cover;
    color: white;
    perspective: 1000px;
  }

  /* 🔐 Passwortfenster Design */
  #passwordScreen {
    position: fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    backdrop-filter: blur(12px);
    background: rgba(0,0,0,0.65);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index: 5000;
    animation: fadeIn 0.8s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity:0; }
    to { opacity:1; }
  }

  #pwBox {
    background: rgba(255,255,255,0.15);
    padding: 4vw;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    text-align:center;
    border: 2px solid rgba(255,255,255,0.3);
  }

  #pwBox h2 {
    font-size: 5vw;
    margin-bottom: 2vw;
    color: #FFD700;
    text-shadow: 2px 2px 5px #000;
  }

  #pwInput {
    font-size: 4vw;
    padding: 1vw 2vw;
    border-radius: 10px;
    border:none;
    width: 60%;
    text-align:center;
  }

  #pwBtn {
    margin-top: 2vw;
    padding: 1vw 3vw;
    font-size: 4vw;
    background: #FFD700;
    color:#000;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
  }

  #pwBtn:hover {
    background:#fff099;
  }

  #pwError {
    margin-top:1vw;
    font-size:3.5vw;
    color:#ff4444;
    text-shadow:1px 1px 3px #000;
  }


  /* Restlicher Style DEINES Spiels — unverändert */
  h1 {
    margin: 10px 0;
    font-size: 6vw;
    text-shadow: 2px 2px 4px #000;
  }

  #digits {
    margin: 5px 0;
    font-size: 6vw;
    font-weight: bold;
    color: #FFD700;
    text-shadow: 2px 2px 4px #000;
    height: auto;
    transition: transform 0.3s, opacity 0.5s;
    opacity: 0;
  }

  #digits.show {
    opacity: 1;
  }

  #score {
    font-size: 5vw;
    margin: 10px 0;
    font-weight: bold;
    text-shadow: 1px 1px 3px #000;
  }

  #memory-board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 90vw;
    margin: 0 auto 20px auto;
  }

  .card {
    width: 100%;
    padding-top: 100%;
    position: relative;
    border-radius: 8px;
    border: 2px solid #333;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.6s, opacity 0.8s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    opacity: 0;
  }

  .card.show {
    opacity: 1; 
  }

  .card:hover {
    transform: scale(1.05) rotateY(0deg);
    box-shadow: 0 0 15px #FFD700;
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card .front, .card .back {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card .front {
    background: url('Kartenrueckseite.jpg') center center / cover no-repeat;
    opacity: 0.7;
  }

  .card .back img {
    width: 90%;
    height: 90%;
    border-radius: 8px;
  }

  .card .back {
    transform: rotateY(180deg);
  }

  #congrats {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background: rgba(0,0,0,0.8);
    color: #FFD700;
    padding: 5vw;
    border-radius: 15px;
    font-size: 6vw;
    font-weight: bold;
    text-align: center;
    line-height: 1.5;
    z-index:1000;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
  }

  #congrats.show {
    display:block;
    opacity: 1;
  }

  @media (max-width: 600px) {
    #memory-board {
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }
    h1 { font-size: 5vw; }
    #score { font-size: 4vw; }
    #digits { font-size: 10vw; }
    #congrats { font-size: 8vw; padding: 10vw; }
  }
</style>
</head>

<body>

<!-- 🔐 PASSWORT-FENSTER -->
<div id="passwordScreen">
  <div id="pwBox">
    <h2>Passwort erforderlich</h2>
    <input id="pwInput" type="password" placeholder="Passwort" />
    <br>
    <button id="pwBtn" onclick="checkPW()">OK</button>
    <div id="pwError"></div>
  </div>
</div>

<script>
function checkPW(){
  const correct = "1234";   // <<<< HIER ÄNDERN
  const input = document.getElementById("pwInput").value;

  if(input === correct){
    document.getElementById("passwordScreen").style.display = "none";
  } else {
    document.getElementById("pwError").textContent = "Falsches Passwort!";
  }
}
</script>
<!-- 🔐 PASSWORT-FENSTER ENDE -->

<h1>Tropische Früchte Memory</h1>
<div id="digits"></div>
<div id="score">Punkte: 0</div>
<div id="memory-board"></div>

<div id="congrats">
  Glückwunsch! Du hast alle Früchte gefunden!<br><br>
  Hast Du dir auch die Koordinaten notiert?<br>
  NEIN??? Dann musst du da leider nochmal durch ;)
</div>

<script>
/* --- Dein kompletter Memory-Spielcode bleibt UNVERÄNDERT --- */

const fruits = [
  {name: 'Mango', img: 'bilder/mango.jpg'},
  {name: 'Ananas', img: 'bilder/ananas.jpg'},
  {name: 'Guave', img: 'bilder/guave.jpg'},
  {name: 'Drachenfrucht', img: 'bilder/drachenfrucht.jpg'},
  {name: 'Kaki', img: 'bilder/kaki.jpg'},
  {name: 'Passionsfrucht', img: 'bilder/passionsfrucht.jpg'},
  {name: 'Sternfrucht', img: 'bilder/sternfrucht.jpg'},
  {name: 'Kokosnuss', img: 'bilder/kokosnuss.jpg'},
  {name: 'Papaya', img: 'bilder/papaya.jpg'},
  {name: 'Cherimoya', img: 'bilder/cherimoya.jpg'},
  {name: 'Feige', img: 'bilder/feige.jpg'},
  {name: 'Granatapfel', img: 'bilder/granatapfel.jpg'}
];

const digitsSequence = ['N','3','5','7','8','0','E','1','5','2','8','3'];
let digitIndex = 0;
let score = 0;

let cards = [];
fruits.forEach(f => cards.push({...f}, {...f}));
cards.sort(() => 0.5 - Math.random());

const board = document.getElementById('memory-board');
let firstCard = null;
let secondCard = null;
let lockBoard = false;

cards.forEach((fruit, index) => {
  const card = document.createElement('div');
  card.classList.add('card');
  card.dataset.name = fruit.name;

  const front = document.createElement('div');
  front.classList.add('front');

  const back = document.createElement('div');
  back.classList.add('back');
  const img = document.createElement('img');
  img.src = fruit.img;
  back.appendChild(img);

  card.appendChild(front);
  card.appendChild(back);

  card.addEventListener('click', () => flipCard(card));
  board.appendChild(card);

  setTimeout(() => {
    card.classList.add('show');
  }, index * 100);
});

function flipCard(card) {
  if (lockBoard || card === firstCard || card.classList.contains('flipped')) return;
  card.classList.add('flipped');

  if (!firstCard) {
    firstCard = card;
    return;
  }

  secondCard = card;
  checkMatch();
}

function checkMatch() {
  const isMatch = firstCard.dataset.name === secondCard.dataset.name;
  if (isMatch) {
    score++;
    document.getElementById('score').textContent = 'Punkte: ' + score;
    showDigit();
    resetCards(true);
    if(score === cards.length / 2){
      const overlay = document.getElementById('congrats');
      overlay.classList.add('show');
    }
  } else {
    lockBoard = true;
    setTimeout(() => {
      firstCard.classList.remove('flipped');
      secondCard.classList.remove('flipped');
      resetCards(false);
    }, 1000);
  }
}

function resetCards(matched) {
  [firstCard, secondCard] = [null, null];
  lockBoard = false;
}

function showDigit() {
  if (digitIndex < digitsSequence.length) {
    const digitDiv = document.getElementById('digits');
    const digit = digitsSequence[digitIndex];
    digitIndex++;
    digitDiv.textContent = digit;
    digitDiv.classList.add('show');
    digitDiv.style.transform = 'scale(1.5)';
    
    setTimeout(() => {
      digitDiv.style.transform = 'scale(1)';
      digitDiv.classList.remove('show');
      digitDiv.textContent = '';
    }, 1000);
  }
}
</script>

</body>
</html>
